name: Android

# The Android app (android/): FastPlay's engine built with the NDK, its windows
# in Kotlin. Every push to master that changes it, or the engine it is built on,
# builds the APK and puts it on the "latest" release as FastPlay.apk.
#
# Signing needs these repository secrets: ANDROID_KEYSTORE_B64 (the release
# keystore, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD. Without them the APK is signed with a debug key, built
# but not released.

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'ci/ffmpeg/**'
      - 'download-deps.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit: their count is the build number

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      # FastPlay's audio-only FFmpeg for Android, built again only when its build
      # or patches change. Uploaded for local builds.
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-android
          key: ffmpeg-android-${{ hashFiles('ci/ffmpeg/**') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" bash ci/ffmpeg/build.sh android ffmpeg-android

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: ffmpeg-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Chaquopy builds the app's Python (yt-dlp for YouTube) with the same version
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # SQLite and the tempo libraries (deps/); FFmpeg is the one built above
      - name: Download dependencies
        run: |
          chmod +x download-deps.sh
          ./download-deps.sh

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "SIGNED=1"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: FastPlay-Android
          path: android/app/build/outputs/apk/release/FastPlay.apk
          if-no-files-found: error

      # Only a signed build goes out: one signed with a debug key could not be
      # updated by the next. build.yml recreates the release on every push, so
      # it may be gone for a moment: tried again a few times.
      - name: Attach the APK to the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            gh release upload latest android/app/build/outputs/apk/release/FastPlay.apk --clobber && exit 0
            sleep 30
          done
          exit 1
