name: Build

on:
  push:
    # audio-engine: the move from BASS to miniaudio and FFmpeg. Built, never released.
    branches: [master, audio-engine]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download dependencies
        run: .\download-deps.bat

      # FastPlay's audio-only FFmpeg (ci/ffmpeg), built again only when its build
      # script or version changes. Uploaded for local builds (download-deps fetches it).
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-windows-${{ hashFiles('ci/ffmpeg/**') }}

      - name: Set up MSYS2 for the FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils nasm pkgconf

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          # MSYS2's coreutils link.exe would shadow the MSVC linker
          rm -f /usr/bin/link.exe
          JOBS=4 bash ci/ffmpeg/build.sh windows ffmpeg

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg

      # CMake fetches and builds wxWidgets and UniversalSpeech into build\ on the
      # first build; keep that between runs so each build does not repeat it.
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          # A change to CMakeLists.txt starts from the last build, not from nothing
          restore-keys: cmake-deps-${{ runner.os }}-

      # build_new.bat compiles FastPlay.exe, runs dist.bat to produce FastPlay.zip,
      # and invokes Inno Setup (pre-installed on windows-latest) to produce
      # FastPlayInstaller.exe — all with the correct APP_VERSION from version.h
      # and BUILD_COMMIT from git rev-parse. No need to rebuild the zip/installer here.
      - name: Build FastPlay (exe + portable zip + installer)
        run: .\build_new.bat

      # FastPlay runs on Windows 7. An import Windows 7 lacks stops it from starting,
      # and a newer compiler's runtime library can bring one in unnoticed.
      - name: Check FastPlay.exe still runs on Windows 7
        shell: pwsh
        run: |
          $win8Only = 'CreateFile2|CopyFile2|GetSystemTimePreciseAsFileTime|WaitOnAddress|WakeByAddress|SetThreadDescription|GetThreadDescription|GetCurrentThreadStackLimits|FromApp|PrefetchVirtualMemory|GetOverlappedResultEx|api-ms-win-'
          $found = dumpbin /imports FastPlay.exe | Select-String -Pattern $win8Only
          if ($found) {
            Write-Host "FastPlay.exe imports functions Windows 7 does not have:"
            $found | ForEach-Object { Write-Host $_.Line.Trim() }
            exit 1
          }
          Write-Host "No Windows 8+ imports."

      - name: Read APP_VERSION from version.h
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "include\fastplay\version.h" -Pattern '#define APP_VERSION "([^"]+)"'
          $v = $match.Matches.Groups[1].Value
          Write-Host "APP_VERSION: $v"
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: FastPlay.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: FastPlayInstaller.exe

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dependencies
        run: |
          chmod +x download-deps.sh
          ./download-deps.sh

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-macos-${{ hashFiles('ci/ffmpeg/**') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: JOBS="$(sysctl -n hw.ncpu)" bash ci/ffmpeg/build.sh macos ffmpeg

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: ffmpeg

      # As on Windows: keep the fetched and built wxWidgets between runs.
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          # A change to CMakeLists.txt starts from the last build, not from nothing
          restore-keys: cmake-deps-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # One compile per core: a bare --parallel lets make start them all at once.
      # -k reports every compile error in one run instead of stopping at the first.
      - name: Build FastPlay.app
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)" -- -k

      # Ad-hoc signed (no Developer ID): any bundled libraries first, then the app.
      - name: Sign and zip
        run: |
          APP=build/FastPlay.app
          for lib in "$APP"/Contents/Frameworks/*.dylib; do
            [ -e "$lib" ] && codesign --force --sign - "$lib"
          done
          codesign --force --sign - "$APP"
          codesign --verify --verbose "$APP"
          ditto -c -k --keepParent "$APP" FastPlay-macOS.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: FastPlay-macOS.zip

  release:
    needs: [build-windows, build-macos]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download portable zip
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      # Its name contains "macOS", which the Windows updater skips.
      - name: Download macOS app
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      # The Android APK is built by android.yml, only when the app's code changes:
      # the one on the release now goes on the new one.
      - name: Keep the Android APK
        run: gh release download latest -p FastPlay.apk -D artifacts/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Body includes both "commit <sha>" and "**Version:** X.Y.Z" so the in-app
      # updater can parse either via its regexes (commit takes precedence when the
      # local BUILD_COMMIT is set, falling back to version string comparison).
      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from commit ${{ github.sha }}

            **Version:** ${{ needs.build-windows.outputs.app_version }}
            **Built:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.event.head_commit.message }}

            This release is automatically updated on every commit to master.

            ## Download
            - **Windows Installer:** FastPlayInstaller.exe (recommended for most users)
            - **Windows Portable:** FastPlay.zip (no installation required)
            - **macOS:** FastPlay-macOS.zip (macOS 11 or later, Apple silicon and Intel)
            - **Android:** FastPlay.apk (Android 8 or later)

            ## macOS installation
            1. Download and unzip FastPlay-macOS.zip
            2. Move FastPlay.app to Applications
            3. The app is not notarized, so macOS blocks it at first. In Terminal, run:
               `xattr -cr /Applications/FastPlay.app`
            4. Open FastPlay
          files: artifacts/*
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
